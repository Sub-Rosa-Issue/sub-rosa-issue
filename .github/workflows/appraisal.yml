name: Appraisal API checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appraisal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Read-only workflow: downstream steps do not push
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Check appraisal CI configuration
        run: node --test scripts/appraisal-ci.test.mjs

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test appraisal API
        run: pnpm appraisal:test

      - name: Typecheck appraisal API
        run: pnpm appraisal:typecheck
