name: Receipt CLI checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receipt-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Read-only workflow: downstream steps do not push
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Check receipt CLI CI configuration
        run: node --test scripts/receipt-cli-ci.test.mjs

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test receipt CLI
        run: pnpm receipt-cli:test

      - name: Typecheck receipt CLI
        run: pnpm receipt-cli:typecheck
