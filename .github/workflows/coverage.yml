name: TypeScript coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  # Los cuatro workflows solo leen el repo: clonan, instalan y corren
  # tests. Ninguno hace push, ni comenta, ni publica, ni toca secrets.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Read-only workflow: downstream steps do not push
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate structured logging
        run: pnpm logging:test && pnpm logging:check

      - name: Validate error normalization
        run: pnpm errors:normalize:test && pnpm errors:normalize:check
      - name: Validate workflow pnpm version matches packageManager
        run: pnpm ci:pnpm-version:test && pnpm ci:pnpm-version:check

      - name: Mainnet readiness matches the committed manifest (recorded fixture, no RPC, no secrets)
        run: |
          pnpm --filter @sub-rosa/sdk exec tsx scripts/mainnet-ready.ts --strict --fixture
          pnpm --filter @sub-rosa/sdk exec tsx scripts/mainnet-verify.ts --fixture

      - name: Run coverage gate
        run: pnpm coverage:test

      - name: Assert all workflow checkout steps disable credential persistence
        run: pnpm wf-creds:check
