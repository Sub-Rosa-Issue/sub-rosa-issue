name: Line lengths check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  # This workflow only reads the repo: clones, installs and runs
  # tests. It does not push, comment, publish, or touch secrets.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Check line lengths in executable config files
        run: pnpm line-lengths:check

      - name: Run line lengths script tests
        run: pnpm line-lengths:test