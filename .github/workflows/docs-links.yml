name: Docs link check

on:
  push:
    paths:
      - '**.md'
      - '.env.example'
      - 'apps/web/.env.example'
      - 'package.json'
      - 'scripts/check-deploy-docs.mjs'
      - 'scripts/check-links.js'
      - 'scripts/docs-links-ci.test.mjs'
      - '.github/workflows/docs-links.yml'
  pull_request:
    paths:
      - '**.md'
      - '.env.example'
      - 'apps/web/.env.example'
      - 'package.json'
      - 'scripts/check-deploy-docs.mjs'
      - 'scripts/check-links.js'
      - 'scripts/docs-links-ci.test.mjs'
      - '.github/workflows/docs-links.yml'

permissions:
  # The workflow only reads the repo: clones, installs, and runs tests.
  # It does not push, comment, publish, or touch secrets.
  contents: read

concurrency:
  # Cancel superseded docs-link checks on the same branch/ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Read-only workflow: downstream steps do not push
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check docs link workflow configuration
        run: node --test scripts/docs-links-ci.test.mjs
      # Validates deployment documentation consistency with .env examples and package scripts
      - name: Validate deployment documentation
        run: node scripts/check-deploy-docs.mjs
      - name: Check local markdown links
        run: node scripts/check-links.js
