name: Docs link check

on:
  push:
    paths:
      - '**.md'
      - 'scripts/check-links.js'
      - 'scripts/docs-links-ci.test.mjs'
      - '.github/workflows/docs-links.yml'
  pull_request:
    paths:
      - '**.md'
      - 'scripts/check-links.js'
      - 'scripts/docs-links-ci.test.mjs'
      - '.github/workflows/docs-links.yml'

permissions:
  # Los cuatro workflows solo leen el repo: clonan, instalan y corren
  # tests. Ninguno hace push, ni comenta, ni publica, ni toca secrets.
  contents: read

concurrency:
  # Cancel superseded docs-link checks on the same branch/ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Read-only workflow: downstream steps do not push
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check docs link workflow configuration
        run: node --test scripts/docs-links-ci.test.mjs
      - name: Check local markdown links
        run: node scripts/check-links.js
