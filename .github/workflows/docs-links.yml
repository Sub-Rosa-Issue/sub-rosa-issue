name: Docs link check

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.env.example'
      - 'apps/web/.env.example'
      - 'package.json'
      - 'packages/*/package.json'
      - 'services/*/package.json'
      - 'apps/*/package.json'
      - 'scripts/check-links.js'
      - 'scripts/check-deploy-docs.mjs'
      - 'scripts/check-deploy-docs.test.mjs'
      - 'scripts/docs-links-ci.test.mjs'
      - '.github/workflows/docs-links.yml'
  pull_request:

permissions:
  # Los cuatro workflows solo leen el repo: clonan, instalan y corren
  # tests. Ninguno hace push, ni comenta, ni publica, ni toca secrets.
  contents: read

concurrency:
  # Cancel superseded docs-link checks on the same branch/ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Read-only workflow: downstream steps do not push
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check docs link workflow configuration
        run: node --test scripts/docs-links-ci.test.mjs
      - name: Check local markdown links
        run: node scripts/check-links.js
      - name: Run deployment documentation check tests
        run: node --test scripts/check-deploy-docs.test.mjs
      - name: Validate deployment documentation (docs:check)
        run: npm run docs:check
