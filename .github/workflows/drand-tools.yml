name: Drand tools checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drand-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Read-only workflow: downstream steps do not push
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Check Drand tools CI configuration
        run: node --test scripts/drand-tools-ci.test.mjs

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test Drand tools
        run: pnpm drand-tools:test

      - name: Typecheck Drand tools
        run: pnpm drand-tools:typecheck
