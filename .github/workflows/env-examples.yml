name: Environment template check

on:
  push:
    paths:
      - '.env.example'
      - 'apps/web/.env.example'
      - 'scripts/check-env-examples.mjs'
      - 'scripts/check-env-examples.test.mjs'
      - 'package.json'
      - '.github/workflows/env-examples.yml'
  pull_request:
    paths:
      - '.env.example'
      - 'apps/web/.env.example'
      - 'scripts/check-env-examples.mjs'
      - 'scripts/check-env-examples.test.mjs'
      - 'package.json'
      - '.github/workflows/env-examples.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Read-only workflow: downstream steps do not push
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test environment template validation
        run: node --test scripts/check-env-examples.test.mjs
      - name: Validate both environment templates
        run: node scripts/check-env-examples.mjs
