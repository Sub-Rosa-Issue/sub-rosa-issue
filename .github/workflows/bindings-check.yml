name: Bindings check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  # Los cuatro workflows solo leen el repo: clonan, instalan y corren
  # tests. Ninguno hace push, ni comenta, ni publica, ni toca secrets.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Read-only workflow: downstream steps do not push
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert pinned Stellar CLI workflow
        run: node --test scripts/check-bindings-cli.test.mjs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          toolchain: "1.91.0"
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "contracts/round"

      - name: Install Stellar CLI
        env:
          STELLAR_CLI_URL: https://github.com/stellar/stellar-cli/releases/download/v22.8.2/stellar-cli-22.8.2-x86_64-unknown-linux-gnu.tar.gz
          STELLAR_CLI_SHA256: faeaec7f7a16c008f25c8b9a6d5fb047831e97b74c85336db4f6ad5877ae9c4f
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d "$RUNNER_TEMP/stellar-cli.XXXXXX")"
          archive="$install_dir/stellar-cli.tar.gz"
          curl --fail --silent --show-error --location --retry 3 "$STELLAR_CLI_URL" -o "$archive"
          printf "%s  %s\n" "$STELLAR_CLI_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Print Stellar CLI version
        run: stellar --version

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated bindings are up to date
        run: pnpm bindings:check
      - name: Fail if the worktree is dirty after the bindings check
        run: git diff --exit-code
