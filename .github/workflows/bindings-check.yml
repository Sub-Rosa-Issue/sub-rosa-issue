name: Bindings check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  # Los cuatro workflows solo leen el repo: clonan, instalan y corren
  # tests. Ninguno hace push, ni comenta, ni publica, ni toca secrets.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Assert pinned Stellar CLI workflow
        run: node --test scripts/check-bindings-cli.test.mjs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (v1)
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "contracts/round"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libdbus-1-dev libudev-dev libsodium-dev

      - name: Install stellar CLI
        # 22.8.2 is the latest stable stellar-cli that still supports soroban-sdk 22.
        # CLI 23.0.0 and newer require soroban-sdk 23.
        run: cargo install stellar-cli --version 22.8.2 --locked

      - name: Print Stellar CLI version
        run: stellar --version

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated bindings are up to date
        run: pnpm bindings:check
