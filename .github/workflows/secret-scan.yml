name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  # Lee el repo para escanear el historial y el arbol de trabajo. Escribe
  # unicamente en code scanning (SARIF) para que los hallazgos se puedan
  # revisar en la pestana Security. No hace push, ni comenta, ni publica.
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: el escaneo tiene que cubrir los commits que
          # llegan a main, no solo el ultimo.
          fetch-depth: 0

      - name: Install gitleaks (version fijada + checksum verificado)
        run: |
          set -euo pipefail
          version="v8.30.1"
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/${version}/${archive}"
          curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/${version}/gitleaks_8.30.1_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history and working tree for secrets
        run: |
          set -euo pipefail
          # --redact nunca imprime el valor detectado: ni en el log del job ni
          # en el informe SARIF que se sube a code scanning.
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Publish results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: secret-scan
