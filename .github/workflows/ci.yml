name: CI Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.13.1'
  RUST_VERSION: '1.75.0'

jobs:
  typescript-checks:
    name: TypeScript Workspace Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type checking
        run: pnpm typecheck

      - name: Run SDK tests
        run: pnpm test:sdk

      - name: Run tlock tests
        run: pnpm test:tlock

      - name: Run keeper tests
        run: pnpm test:keeper

      - name: Run appraisal API tests
        run: pnpm test:appraisal-api

      - name: Run agent tests
        run: pnpm test:agent

      - name: Run web tests
        run: pnpm test:web

      - name: Build web production
        run: pnpm build:web

      - name: Lint TypeScript code
        run: pnpm lint

  rust-checks:
    name: Rust/Soroban Contract Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-version: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy -- -D warnings

      - name: Run contract tests
        run: cargo test --all

      - name: Build Soroban contract
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Check contract size
        run: |
          CONTRACT_SIZE=$(wc -c < target/wasm32-unknown-unknown/release/*.wasm)
          echo "Contract size: $CONTRACT_SIZE bytes"
          if [ $CONTRACT_SIZE -gt 700000 ]; then
            echo "Warning: Contract size exceeds recommended limit"
          fi

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [typescript-checks, rust-checks]
    if: always()
    
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.typescript-checks.result }}" != "success" ] || \
             [ "${{ needs.rust-checks.result }}" != "success" ]; then
            echo "❌ Quality gate failed"
            exit 1
          else
            echo "✅ All quality gates passed"
          fi