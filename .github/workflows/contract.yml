name: Contract tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  # Los cuatro workflows solo leen el repo: clonan, instalan y corren
  # tests. Ninguno hace push, ni comenta, ni publica, ni toca secrets.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  round-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Read-only workflow: downstream steps do not push
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          toolchain: "1.85.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "contracts/round"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run round contract unit tests
        run: cargo test -p sub-rosa-round

      - name: Fail if generated contract snapshots differ from committed evidence
        run: |
          git diff --exit-code -- contracts/round/test_snapshots/test
          test -z "$(git ls-files --others --exclude-standard -- contracts/round/test_snapshots/test)"

      - name: Check ERRORS.md stays in sync with enum Error
        run: node scripts/check-round-errors.mjs

      - name: Run error drift script tests
        run: node --test scripts/check-round-errors.test.mjs

      - name: Assert pinned Rust toolchain alignment
        run: node --test scripts/check-rust-toolchain.test.mjs && node scripts/check-rust-toolchain.mjs
